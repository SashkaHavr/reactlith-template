name: Reusable workspace check

on:
  workflow_call:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
