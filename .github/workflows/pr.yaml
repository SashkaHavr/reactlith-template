name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-check:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check

  deploy:
    needs: run-check
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.RAILWAY_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
      RAILWAY_DEFAULT_ENVIRONMENT: ${{ vars.RAILWAY_DEFAULT_ENVIRONMENT || 'production' }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    outputs:
      domains-web: ${{ steps.deploy.outputs.domains-web }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          run-install: false
      - run: vp install --frozen-lockfile --filter db --filter railway
      - run: vp add -g @railway/cli@5
      - run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_DEFAULT_ENVIRONMENT"
      - name: Ensure preview environment exists
        run: |
          if [[ "$(railway environment list --json | jq -r --arg name "$RAILWAY_ENVIRONMENT" 'any(.environments[]; .name == $name)')" == "false" ]]; then
            railway environment new "$RAILWAY_ENVIRONMENT"
          fi
      - run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"
      - uses: ./.github/actions/prepare-deploy
        id: deploy
        with:
          domains: true
      - parallel:
          - name: Deploy API
            run: railway up --service api --ci
          - name: Deploy web
            run: railway up --service web --ci

  comment:
    needs: deploy
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - run: 'gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Preview: $DOMAIN"'
        env:
          DOMAIN: ${{ needs.deploy.outputs.domains-web }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  destroy:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.RAILWAY_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
      RAILWAY_DEFAULT_ENVIRONMENT: ${{ vars.RAILWAY_DEFAULT_ENVIRONMENT || 'production' }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          run-install: false
      - run: vp add -g @railway/cli@5
      - run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_DEFAULT_ENVIRONMENT"
      - run: railway environment delete "$RAILWAY_ENVIRONMENT" --yes
