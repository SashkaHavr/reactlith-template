name: Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - example

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check
  deploy:
    runs-on: ubuntu-latest
    needs: run-check
    if: ${{ vars.RAILWAY_PROJECT_ID != '' }}
    env:
      RAILWAY_DEFAULT_ENVIRONMENT: ${{ vars.RAILWAY_DEFAULT_ENVIRONMENT || 'production' }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          run-install: false
      - run: vp install --frozen-lockfile --filter db --filter railway
      - run: vp add -g @railway/cli@5
      - run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_DEFAULT_ENVIRONMENT"

      - uses: ./.github/actions/deploy
