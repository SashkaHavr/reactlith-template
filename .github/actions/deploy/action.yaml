name: Deploy to Railway

inputs:
  domains:
    required: false
    default: "false"

outputs:
  domains-web:
    value: ${{ steps.domains-web.outputs.link }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/extract-database-url

    - shell: bash
      run: railway config plan --out railway-plan.json
    - name: Reject destructive Railway plan
      shell: bash
      run: |
        if [[ "$(jq -r '.destructive' railway-plan.json)" == "true" ]]; then
          exit 1
        fi
    - name: Reject destructive database migration
      if: ${{ env.DATABASE_URL != '' }}
      shell: bash
      run: bun --filter @reactlith-template/db push --explain

    - shell: bash
      run: railway config apply --plan railway-plan.json --yes
    - uses: ./.github/actions/extract-database-url
    - name: Run database migration
      shell: bash
      run: |
        for attempt in {1..5}; do
          if bun --filter @reactlith-template/db push; then
            exit 0
          else
            status=$?
          fi
          if [[ "$status" -ne 1 || "$attempt" -eq 5 ]]; then
            exit "$status"
          fi
          echo "Database push failed (attempt $attempt/5); retrying in 5 seconds..."
          sleep 5
        done
    - shell: bash
      if: ${{ inputs.domains == 'true' }}
      run: railway domain --service web --json
    - shell: bash
      run: railway up --service web --ci
    - name: Write domain to output
      id: domains-web
      if: ${{ inputs.domains == 'true' }}
      shell: bash
      run: echo "link=$(railway domain --service web --json | jq -r '.domains[0]')" >> "$GITHUB_OUTPUT"
