services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/home/vscode/reactlith-template:cached
      - ~/.local/share/opencode-devcontainer:/home/vscode/.local/share/opencode
      - ~/.config/codex-devcontainer:/home/vscode/.codex
      - ~/.config/t3-devcontainer:/home/vscode/.t3
    networks:
      - db-network
      - devcontainer-proxy
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/postgres
      BETTER_AUTH_SECRET: abcdefghijklmnopqrstuvwxyz123456789
      BETTER_AUTH_ALLOWED_HOSTS: '["localhost:*", "127.0.0.1:*", "web.reactlith-template.localhost"]'
      GOOGLE_CLIENT_ID: my-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: GOCSPX-secret
      GOOGLE_EMULATE_URL: http://emulate.localhost
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.reactlith-template-web.rule=Host(`web.reactlith-template.localhost`)
      - traefik.http.routers.reactlith-template-web.service=reactlith-template-web
      - traefik.http.services.reactlith-template-web.loadbalancer.server.port=3000
      - traefik.http.routers.reactlith-template-opencode.rule=Host(`opencode.reactlith-template.localhost`)
      - traefik.http.routers.reactlith-template-opencode.service=reactlith-template-opencode
      - traefik.http.services.reactlith-template-opencode.loadbalancer.server.port=4096
      - traefik.http.routers.reactlith-template-t3.rule=Host(`t3.reactlith-template.localhost`)
      - traefik.http.routers.reactlith-template-t3.service=reactlith-template-t3
      - traefik.http.services.reactlith-template-t3.loadbalancer.server.port=3773
      - traefik.http.routers.reactlith-template-db.rule=Host(`db.reactlith-template.localhost`)
      - traefik.http.routers.reactlith-template-db.service=reactlith-template-db
      - traefik.http.services.reactlith-template-db.loadbalancer.server.port=4983
  db:
    image: postgres:17
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-t", "10"]
      interval: 1s
      timeout: 10s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}

networks:
  db-network:
  devcontainer-proxy:
    external: true

volumes:
  db-data:
